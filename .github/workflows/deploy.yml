name: Deploy to Cloudflare

# Manual only, on purpose. This repo is also the backup, so pushes need to be
# cheap and frequent — and every push to main used to ship straight to
# production, which meant "back up my work" and "put it live" were the same
# action. Deploy from the Actions tab ("Run workflow"), or locally with
# `npx wrangler deploy`.
#
# NOTE: this workflow only deploys the MAIN site worker. The checkout worker is
# deployed separately: npx wrangler deploy --config wrangler.checkout.jsonc
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy worker + static assets
    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets are present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing or empty"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing or empty"
            exit 1
          fi
          echo "Both secrets present."

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.76.0"
